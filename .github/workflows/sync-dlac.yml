name: Sync library into dlac

# On every push to main, vendor bludex into the dlac repo as the Job helper
# module jobhelpers/blu/bludex/ (dlac's module contract, api = 2): the
# relocatable library (lib/ ui/ data/ icons/) plus the adapter authored in
# dlacmodule/ (init.lua + README.md). Modules derive their require base from
# their own module name, so this is a pure copy -- no rewriting.
#
# One-time setup: create a fine-grained PAT with Contents read/write on
# henkpoa/dlac and store it as the DLAC_SYNC_TOKEN secret in henkpoa/bludex.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bludex
        uses: actions/checkout@v7

      - name: Checkout dlac (dev)
        uses: actions/checkout@v7
        with:
          repository: henkpoa/dlac
          token: ${{ secrets.DLAC_SYNC_TOKEN }}
          ref: dev
          path: .dlac

      # THE STAMP IS WRITTEN LAST, NOT HERE. VENDORED.md names the bludex
      # commit this folder came from, so it differs on EVERY push to main --
      # which made a dlac commit out of every docs-only push: library
      # byte-identical, one line of provenance different, dlac's dev and main
      # diverged for nothing. The previous stamp is carried across the rebuild
      # untouched (byte for byte -- `cat`/`printf` would eat the trailing
      # newline and reintroduce the very diff this avoids), so the comparison
      # below sees only real library changes.
      - name: Vendor the module into dlac/jobhelpers/blu/bludex
        run: |
          DEST=.dlac/jobhelpers/blu/bludex
          PREV="$RUNNER_TEMP/VENDORED.prev"
          if [ -f "$DEST/VENDORED.md" ]; then cp "$DEST/VENDORED.md" "$PREV"; fi
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r lib ui data icons "$DEST"/
          cp dlacmodule/init.lua dlacmodule/README.md "$DEST"/
          if [ -f LICENSE ]; then cp LICENSE "$DEST"/LICENSE; fi
          if [ -f "$PREV" ]; then cp "$PREV" "$DEST/VENDORED.md"; fi

      - name: Commit and push to dlac dev
        run: |
          DEST=.dlac/jobhelpers/blu/bludex
          git -C .dlac config user.name  "bludex-sync[bot]"
          git -C .dlac config user.email "actions@users.noreply.github.com"
          git -C .dlac add -A jobhelpers/blu/bludex
          if git -C .dlac diff --cached --quiet; then
            echo "module already up to date -- nothing vendored changed"
            exit 0
          fi
          # only now is the stamp worth moving: the library really differs
          {
            echo "# VENDORED -- do not hand-edit"
            echo ""
            echo "Synced from https://github.com/henkpoa/bludex @ ${GITHUB_SHA}"
            echo "by .github/workflows/sync-dlac.yml on every push to main."
            echo "init.lua and README.md are authored there under dlacmodule/."
            echo "Edit in the bludex repo; this folder is overwritten wholesale."
          } > "$DEST"/VENDORED.md
          git -C .dlac add -A jobhelpers/blu/bludex
          git -C .dlac commit -m "jobhelpers/blu/bludex: sync from bludex@${GITHUB_SHA:0:7}"
          git -C .dlac push origin dev
