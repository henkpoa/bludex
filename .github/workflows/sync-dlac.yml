name: Sync library into dlac

# On every push to main, vendor bludex into the dlac repo as the Job helper
# module jobhelpers/blu/bludex/ (dlac's module contract, api = 2): the
# relocatable library (lib/ ui/ data/ icons/) plus the adapter authored in
# dlacmodule/ (init.lua + README.md). Modules derive their require base from
# their own module name, so this is a pure copy -- no rewriting.
#
# One-time setup: create a fine-grained PAT with Contents read/write on
# henkpoa/dlac and store it as the DLAC_SYNC_TOKEN secret in henkpoa/bludex.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bludex
        uses: actions/checkout@v7

      - name: Checkout dlac (dev)
        uses: actions/checkout@v7
        with:
          repository: henkpoa/dlac
          token: ${{ secrets.DLAC_SYNC_TOKEN }}
          ref: dev
          path: .dlac

      - name: Vendor the module into dlac/jobhelpers/blu/bludex
        run: |
          DEST=.dlac/jobhelpers/blu/bludex
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r lib ui data icons "$DEST"/
          cp dlacmodule/init.lua dlacmodule/README.md "$DEST"/
          if [ -f LICENSE ]; then cp LICENSE "$DEST"/LICENSE; fi
          {
            echo "# VENDORED -- do not hand-edit"
            echo ""
            echo "Synced from https://github.com/henkpoa/bludex @ ${GITHUB_SHA}"
            echo "by .github/workflows/sync-dlac.yml on every push to main."
            echo "init.lua and README.md are authored there under dlacmodule/."
            echo "Edit in the bludex repo; this folder is overwritten wholesale."
          } > "$DEST"/VENDORED.md

      - name: Commit and push to dlac dev
        run: |
          cd .dlac
          git config user.name  "bludex-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A jobhelpers/blu/bludex
          if git diff --cached --quiet; then
            echo "module already up to date"
            exit 0
          fi
          git commit -m "jobhelpers/blu/bludex: sync from bludex@${GITHUB_SHA:0:7}"
          git push origin dev
